<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · L. Jonathan Haas</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Karla:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --oat: #efe9df; --linen: #f7f3ec; --walnut: #5b3a24; --walnut-dark: #3b2517; --brass: #b08a3e; --ink: #2a221c; --muted: #6e6258;
  --display: "Jost", "Futura", "Century Gothic", system-ui, sans-serif; --body: "Karla", "Helvetica Neue", Arial, sans-serif; color-scheme: light; }
html, body { margin: 0; }
body { background: var(--oat); color: var(--ink); font: 400 1.0625rem/1.65 var(--body); }
main { max-width: 880px; margin: 0 auto; padding: 72px 24px; }
h1 { font: 500 clamp(2.2rem, 5vw, 3.2rem)/1.05 var(--display); color: var(--walnut-dark); margin: 0 0 16px; }
p { margin: 0 0 12px; color: var(--muted); }
a { color: var(--walnut); text-decoration-color: var(--brass); text-underline-offset: 3px; }
a:focus-visible { outline: 2px solid var(--walnut); outline-offset: 3px; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>There's nothing at this address.</p>
  <p><a href="/">Go to the homepage</a></p>
</main>
</body>
</html>
